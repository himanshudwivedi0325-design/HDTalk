services:
  - type: web
    name: hdtalk-live
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    # Health check endpoint — Render will restart if this stops responding
    healthCheckPath: /api/health/live
    envVars:
      # ── Core ────────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000   # Render assigns its own port via $PORT; this is a fallback

      # ── CORS — set to your actual Render URL ─────────────────────────────
      - key: CLIENT_URL
        value: '*'

      # ── Security Secrets (auto-generated by Render on first deploy) ───────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # ── Web Push / VAPID ──────────────────────────────────────────────────
      # Paste the values from: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false   # Set manually in Render Dashboard → Environment
      - key: VAPID_PRIVATE_KEY
        sync: false   # Set manually in Render Dashboard → Environment
      - key: VAPID_EMAIL
        value: mailto:himanshudwivedi0325@gmail.com

      # ── MongoDB Atlas (persistent cloud database) ──────────────────────────
      - key: MONGODB_URI
        value: mongodb+srv://himanshudwivedi0325_db_user:vj7tDfH57rdwU308@hdtalk-cluster.w65tsyc.mongodb.net/hdtalk?retryWrites=true&w=majority

      # ── n8n Automation ────────────────────────────────────────────────────
      - key: N8N_ENABLED
        value: false   # Enable only when you have a running n8n instance
      - key: N8N_WEBHOOK_URL
        value: ''

      # ── WebRTC TURN (optional — Google STUN used by default) ─────────────
      - key: TURN_URL_UDP
        sync: false
      - key: TURN_URL_TCP
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

      # ── Feature Flags ─────────────────────────────────────────────────────
      - key: ALLOW_QUICK_LOGIN
        value: false
      - key: MAX_MESH_PARTICIPANTS
        value: 6
