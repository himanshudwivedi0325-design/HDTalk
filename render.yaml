services:
  - type: web
    name: hdtalk-live
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    # Health check endpoint — Render will restart if this stops responding
    healthCheckPath: /api/health/live
    envVars:
      # ── Core ────────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000   # Render assigns its own port via $PORT; this is a fallback

      # ── CORS — set to your actual Render URL ─────────────────────────────
      - key: CLIENT_URL
        value: '*'

      # ── Security Secrets (auto-generated by Render on first deploy) ───────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # ── Web Push / VAPID ──────────────────────────────────────────────────
      # Generated via: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        value: BDO1OeUpNQHHGxrbZ2GmcftrnbS8s_hD8JIYoXcr8OJFRYh6juADBhB02WYyBHYhXEQ_2v7OFd1auDKBnVsXNJE
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: mailto:himanshudwivedi0325@gmail.com

      # ── MongoDB Atlas (persistent cloud database) ──────────────────────────
      - key: MONGODB_URI
        sync: false

      # ── n8n Automation ────────────────────────────────────────────────────
      - key: N8N_ENABLED
        value: true
      - key: N8N_WEBHOOK_URL
        sync: false

      # ── WebRTC TURN (optional — Google STUN used by default) ─────────────
      - key: TURN_URL_UDP
        sync: false
      - key: TURN_URL_TCP
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

      # ── Feature Flags ─────────────────────────────────────────────────────
      - key: ALLOW_QUICK_LOGIN
        value: false
      - key: MAX_MESH_PARTICIPANTS
        value: 6
