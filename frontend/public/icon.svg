<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0066FF" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for maskable PWA compatibility -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glowing border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Chat Speech Bubble Geometry -->
  <path d="M150 110 C80 110 40 150 40 230 C40 310 90 350 170 350 H320 L400 420 V330 C445 305 472 265 472 230 C472 150 432 110 362 110 Z"
        fill="url(#brandGrad)"
        filter="url(#dropGlow)"/>

  <!-- Lightning Bolt Emblem inside Bubble -->
  <path d="M290 140 L210 245 H270 L220 330 L315 220 H255 Z"
        fill="#FFFFFF"
        opacity="0.95"/>

  <!-- HD Text Typography -->
  <text x="256" y="255"
        fill="#FFFFFF"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="110"
        font-weight="900"
        letter-spacing="-4"
        text-anchor="middle"
        dominant-baseline="central"
        style="text-shadow: 0 4px 12px rgba(0,0,0,0.4);">HD</text>
</svg>