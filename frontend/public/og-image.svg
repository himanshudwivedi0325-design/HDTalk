<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1324"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="blueGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0066FF" flood-opacity="0.45"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#0066FF" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Brand Logo & Header Icon -->
  <g transform="translate(100, 100)">
    <!-- Speech Bubble Body -->
    <path d="M 38 8 C 16 8 2 22 2 44 C 2 66 16 80 38 80 L 88 80 L 112 104 L 112 74 C 126 66 134 55 134 44 C 134 22 120 8 98 8 Z"
          fill="url(#brandGrad)"
          filter="url(#shadowFilter)"/>
    <text x="66" y="58"
          fill="#FFFFFF"
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
          font-size="48"
          font-weight="900"
          text-anchor="middle"
          letter-spacing="-2">HD</text>
  </g>

  <!-- App Title Typography -->
  <g transform="translate(265, 175)">
    <text x="0" y="0"
          fill="#0066FF"
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
          font-size="78"
          font-weight="900"
          letter-spacing="-2">HD<tspan fill="#FFFFFF" font-weight="600">Talk</tspan></text>
    <!-- PRO Pill -->
    <rect x="250" y="-55" width="80" height="36" rx="18" fill="#0066FF" fill-opacity="0.2" stroke="#00C6FF" stroke-width="1.5"/>
    <text x="290" y="-31"
          fill="#00C6FF"
          font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
          font-size="18"
          font-weight="800"
          text-anchor="middle"
          letter-spacing="1">PRO</text>
  </g>

  <!-- Main Value Proposition Statement -->
  <text x="100" y="260"
        fill="#F1F5F9"
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="34"
        font-weight="700"
        letter-spacing="-0.5">Next-Gen Real-Time Messaging &amp; HD WebRTC Calling</text>

  <text x="100" y="305"
        fill="#94A3B8"
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif"
        font-size="21"
        font-weight="400">Sub-50ms instant chat, crystal-clear 1080p video calls, and synergy matchmaking.</text>

  <!-- Feature Highlights Chips -->
  <g transform="translate(100, 360)">
    <!-- Chip 1 -->
    <g filter="url(#badgeShadow)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#162238" stroke="#0066FF" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="110" y="30" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">⚡ Instant Real-Time</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(240, 0)" filter="url(#badgeShadow)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#162238" stroke="#0066FF" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="110" y="30" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">📹 1080p HD Calling</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(480, 0)" filter="url(#badgeShadow)">
      <rect x="0" y="0" width="230" height="48" rx="24" fill="#162238" stroke="#0066FF" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="115" y="30" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">🤝 Synergy Matching</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(730, 0)" filter="url(#badgeShadow)">
      <rect x="0" y="0" width="220" height="48" rx="24" fill="#162238" stroke="#0066FF" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="110" y="30" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">📱 Installable PWA</text>
    </g>
  </g>

  <!-- Bottom Bar: Creator Attribution & Canonical URL -->
  <g transform="translate(100, 520)">
    <!-- Creator Pill -->
    <rect x="0" y="0" width="340" height="44" rx="22" fill="#0f172a" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="22" cy="22" r="6" fill="#00C6FF"/>
    <text x="40" y="27" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500">Engineered by</text>
    <text x="146" y="27" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Himanshu Dwivedi</text>

    <!-- URL Tag -->
    <text x="1000" y="28" fill="#38BDF8" font-family="'Plus Jakarta Sans', monospace" font-size="16" font-weight="600" text-anchor="end">https://hdtalk.onrender.com</text>
  </g>
</svg>
